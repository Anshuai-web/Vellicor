<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 110" width="100%" height="100%" fill="none">
  <defs>
    <!-- Primary Orbital Trajectory: Cyan to Indigo Velocity Stream -->
    <linearGradient id="vOrbitStream" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="50%" stop-color="#22D3EE"/>
      <stop offset="100%" stop-color="#6366F1"/>
    </linearGradient>

    <!-- Counter Orbital Trajectory: Subtle Platinum Path -->
    <linearGradient id="vOrbitCounter" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E2E8F0"/>
      <stop offset="100%" stop-color="#64748B"/>
    </linearGradient>

    <!-- Anchored Core Gold: Deep Radiant Luster -->
    <linearGradient id="vCoreGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDF0CD"/>
      <stop offset="40%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#AA7C1E"/>
    </linearGradient>

    <!-- Core Nucleus Glow Filter -->
    <filter id="vCoreGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="0" stdDeviation="3" flood-color="#D4AF37" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- MARK: THE ORBITAL VELOCITY CORE (OPTION 03) -->
  <g transform="translate(8, 5)">
    <!-- Primary Orbital Trajectory (High Kinetic Velocity) -->
    <ellipse cx="50" cy="50" rx="44" ry="15" transform="rotate(-30 50 50)" stroke="url(#vOrbitStream)" stroke-width="3.2" stroke-linecap="round"/>
    
    <!-- Secondary Counter Orbital Trajectory (Dynamic Equilibrium) -->
    <ellipse cx="50" cy="50" rx="44" ry="15" transform="rotate(30 50 50)" stroke="url(#vOrbitCounter)" stroke-width="2" stroke-dasharray="7 4" opacity="0.6"/>

    <!-- THE CORE: Solid Anchored Diamond Keystone Nucleus -->
    <g filter="url(#vCoreGlow)">
      <polygon points="50,29 66,50 50,71 34,50" fill="url(#vCoreGold)"/>
      <polygon points="50,37 58,50 50,63 42,50" fill="#060B14"/>
      <circle cx="50" cy="50" r="2.5" fill="#FFFFFF"/>
    </g>
    
    <!-- Kinetic Velocity Particles -->
    <circle cx="80" cy="33" r="2.8" fill="#22D3EE"/>
    <circle cx="20" cy="67" r="2.2" fill="#D4AF37"/>
  </g>

  <!-- WORDMARK: VELLICOR TECHNOLOGIES -->
  <g transform="translate(125, 66)">
    <text font-family="'Plus Jakarta Sans', -apple-system, sans-serif" 
          font-weight="800" 
          font-size="42" 
          letter-spacing="1.5" 
          fill="#FFFFFF">VELLICOR</text>
    
    <text x="235" y="-1" 
          font-family="'Plus Jakarta Sans', -apple-system, sans-serif" 
          font-weight="500" 
          font-size="24" 
          letter-spacing="2" 
          fill="url(#vCoreGold)">TECHNOLOGIES</text>

    <!-- Tagline: Velocity & Core -->
    <text x="3" y="24" 
          font-family="'Outfit', 'Plus Jakarta Sans', sans-serif" 
          font-weight="600" 
          font-size="10.5" 
          letter-spacing="5" 
          fill="#94A3B8">VELOCITY &#8226; CORE &#8226; TRANSFORMATION</text>
  </g>
</svg>
