<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 80" fill="none">
  <defs>
    <linearGradient id="vLogGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818CF8"/>
      <stop offset="50%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#4F46E5"/>
    </linearGradient>
    <linearGradient id="vLogGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22D3EE"/>
      <stop offset="50%" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#0891B2"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="85%" stop-color="#E2E8F0"/>
      <stop offset="100%" stop-color="#CBD5E1"/>
    </linearGradient>
    <linearGradient id="vSubtleGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#06B6D4" stop-opacity="0.1"/>
    </linearGradient>
    <filter id="vLogoGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Left Icon Emblem (64x64 scaled within 80px height) -->
  <g transform="translate(8, 8)">
    <rect width="64" height="64" rx="16" fill="#0B132B"/>
    <rect width="64" height="64" rx="16" fill="url(#vSubtleGlow)"/>
    <rect x="0.75" y="0.75" width="62.5" height="62.5" rx="15.25" stroke="rgba(99, 102, 241, 0.45)" stroke-width="1.5"/>

    <!-- Left Arm -->
    <path d="M15 17 L27 17 L33 41 L27 51 Z" fill="url(#vLogGrad1)" filter="url(#vLogoGlow)"/>
    <!-- Right Arm -->
    <path d="M49 17 L37 17 L31 41 L37 51 Z" fill="url(#vLogGrad2)" filter="url(#vLogoGlow)"/>
    <!-- Central Apex -->
    <polygon points="32,27 37,38 32,49 27,38" fill="#F8FAFC" opacity="0.95"/>
    <circle cx="32" cy="37" r="2.2" fill="#6366F1"/>
    <!-- Top node -->
    <circle cx="32" cy="18" r="2.2" fill="#22D3EE"/>
  </g>

  <!-- Wordmark "VELLICOR" -->
  <text x="88" y="44" font-family="'Plus Jakarta Sans', 'Inter', -apple-system, sans-serif" font-size="28" font-weight="800" letter-spacing="0.05em" fill="url(#textGrad)">
    VELLI<tspan fill="#06B6D4">COR</tspan>
  </text>

  <!-- Subtitle "TECHNOLOGIES LTD" -->
  <text x="89" y="59" font-family="'Plus Jakarta Sans', 'Inter', -apple-system, sans-serif" font-size="9" font-weight="700" letter-spacing="0.28em" fill="#818CF8">
    TECHNOLOGIES LTD
  </text>
  
  <!-- US Flag Accent Pill -->
  <g transform="translate(262, 49)">
    <rect width="46" height="12" rx="4" fill="rgba(99, 102, 241, 0.15)" stroke="rgba(99, 102, 241, 0.4)" stroke-width="0.75"/>
    <text x="23" y="9" font-family="'Plus Jakarta Sans', sans-serif" font-size="7" font-weight="800" letter-spacing="0.1em" fill="#38BDF8" text-anchor="middle">USA HQ</text>
  </g>
</svg>
