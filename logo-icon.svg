<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="vGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818CF8"/>
      <stop offset="50%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#4F46E5"/>
    </linearGradient>
    <linearGradient id="vGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22D3EE"/>
      <stop offset="50%" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#0891B2"/>
    </linearGradient>
    <linearGradient id="vGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#06B6D4" stop-opacity="0.1"/>
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Base Icon Plate -->
  <rect width="100" height="100" rx="24" fill="#0B132B"/>
  <rect width="100" height="100" rx="24" fill="url(#vGlow)"/>
  <rect x="1" y="1" width="98" height="98" rx="23" stroke="rgba(99, 102, 241, 0.4)" stroke-width="1.5"/>

  <!-- Left Chevron Arm of the V -->
  <path d="M24 26 L42 26 L52 64 L42 80 Z" fill="url(#vGrad1)" filter="url(#neonGlow)"/>

  <!-- Right Chevron Arm of the V -->
  <path d="M76 26 L58 26 L48 64 L58 80 Z" fill="url(#vGrad2)" filter="url(#neonGlow)"/>

  <!-- Dimensional Central Apex Core -->
  <polygon points="50,42 58,60 50,76 42,60" fill="#F8FAFC" opacity="0.95"/>
  <circle cx="50" cy="58" r="3.5" fill="#6366F1"/>

  <!-- Upper Quantum Energy Node -->
  <circle cx="50" cy="28" r="3.5" fill="#22D3EE"/>
  <line x1="50" y1="32" x2="50" y2="40" stroke="#22D3EE" stroke-width="2" stroke-dasharray="2 2"/>
</svg>
