<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%" fill="none">
  <defs>
    <!-- Primary Orbital Trajectory: Cyan to Indigo Velocity Stream -->
    <linearGradient id="iconOrbitStream" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="50%" stop-color="#22D3EE"/>
      <stop offset="100%" stop-color="#6366F1"/>
    </linearGradient>

    <!-- Counter Orbital Trajectory: Subtle Platinum Path -->
    <linearGradient id="iconOrbitCounter" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E2E8F0"/>
      <stop offset="100%" stop-color="#64748B"/>
    </linearGradient>

    <!-- Anchored Core Gold: Deep Radiant Luster -->
    <linearGradient id="iconCoreGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDF0CD"/>
      <stop offset="40%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#AA7C1E"/>
    </linearGradient>

    <!-- Core Nucleus Glow Filter -->
    <filter id="iconCoreGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="0" stdDeviation="3" flood-color="#D4AF37" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- ICON: THE ORBITAL VELOCITY CORE (OPTION 03) -->
  <g>
    <!-- Primary Orbital Trajectory (High Kinetic Velocity) -->
    <ellipse cx="50" cy="50" rx="44" ry="15" transform="rotate(-30 50 50)" stroke="url(#iconOrbitStream)" stroke-width="3.5" stroke-linecap="round"/>
    
    <!-- Secondary Counter Orbital Trajectory (Dynamic Equilibrium) -->
    <ellipse cx="50" cy="50" rx="44" ry="15" transform="rotate(30 50 50)" stroke="url(#iconOrbitCounter)" stroke-width="2" stroke-dasharray="7 4" opacity="0.6"/>

    <!-- THE CORE: Solid Anchored Diamond Keystone Nucleus -->
    <g filter="url(#iconCoreGlow)">
      <polygon points="50,29 66,50 50,71 34,50" fill="url(#iconCoreGold)"/>
      <polygon points="50,37 58,50 50,63 42,50" fill="#060B14"/>
      <circle cx="50" cy="50" r="2.5" fill="#FFFFFF"/>
    </g>
    
    <!-- Kinetic Velocity Particles -->
    <circle cx="80" cy="33" r="3" fill="#22D3EE"/>
    <circle cx="20" cy="67" r="2.4" fill="#D4AF37"/>
  </g>
</svg>
